# Gateway alias -> providers tried in order. Groq serves the alias itself; OpenRouter has no
# free gpt-oss, so the fallback is the closest free model of a similar size. Low reasoning
# effort keeps gpt-oss from spending small max_tokens budgets on hidden reasoning.
gpt-oss-120b:
  - { provider: groq, model: "openai/gpt-oss-120b", params: { reasoning_effort: low } }
  - { provider: openrouter, model: "nvidia/nemotron-3-super-120b-a12b:free" }
gpt-oss-20b:
  - { provider: groq, model: "openai/gpt-oss-20b", params: { reasoning_effort: low } }
  - { provider: openrouter, model: "google/gemma-4-26b-a4b-it:free" }
