[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with keys, limits, budgets, cache and provider fallback"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "fastapi>=0.143",
    "httpx>=0.28",
    "prometheus-client>=0.26",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "pyjwt>=2.15",
    "pyyaml>=6.0",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "openai>=3.27.0",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
